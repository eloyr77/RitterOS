## (46b) OpenSSL's build targets for RitterOS, given to its Configure with
## --config (the Makefile's "OpenSSL" part): ritteros-x86_64 and
## ritteros-aarch64. Upstream's base Unix template with the choices its
## Linux targets make (pthreads, dlopen, GNU ld's shared libraries with a
## soname and version script, the ELF assembly of each architecture), less
## what only Linux has (AF_ALG, -ldl: dlopen is in RitterOS's C library).
## The compiler and linker come from the Makefile (CC, CFLAGS, LDFLAGS: zig's
## clang for RitterOS's headers, sdk/ritteros-ld for the link).
## RITTEROS_OPENSSL_HELP, from the Makefile, is our object holding the
## openssl program's PROGRAM_HELP line, linked into the program only.

my %targets = (
    "ritteros-common" => {
        inherit_from     => [ "BASE_unix" ],
        template         => 1,
        CFLAGS           => "-O2",
        cflags           => threads("-pthread"),
        ex_libs          => "",
        thread_scheme    => "pthreads",
        dso_scheme       => "dlfcn",
        shared_target    => "linux-shared",
        shared_cflag     => "-fPIC",
        shared_extension => ".so.\$(SHLIB_VERSION_NUMBER)",
        bin_lflags       => add($ENV{RITTEROS_OPENSSL_HELP} // ""),
    },
    "ritteros-x86_64" => {
        inherit_from     => [ "ritteros-common" ],
        lib_cppflags     => add("-DL_ENDIAN"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'x86_64',
        perlasm_scheme   => "elf",
    },
    "ritteros-aarch64" => {
        inherit_from     => [ "ritteros-common" ],
        # (as x86_64's, not Linux's RC4_CHAR: the headers it generates are
        # one copy in /system/include for both architectures, and RC4_INT
        # is in them)
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "linux64",
    },
);
